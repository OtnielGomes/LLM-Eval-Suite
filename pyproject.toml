# =============================================================================
# LLM Eval Suite — pyproject.toml
# Managed with uv (https://docs.astral.sh/uv)
#
# Initial setup:
# uv sync           → creates .venv and installs all dependencies
# uv sync --group dev → includes dev tools (pytest, ruff, mypy)
# uv run run-benchmark → runs the benchmark directly via uv
#
# Required environment variables (.env):
# OLLAMA_API_KEY    → Ollama Cloud key (ollama.com/settings/keys)
# OLLAMA_CLOUD_MODEL → e.g. llama3.3:70b
# LANGSMITH_API_KEY → LangSmith key (smith.langchain.com/settings)
# LANGSMITH_PROJECT → project name in the dashboard (e.g. llm-eval-suite)
# LANGSMITH_TRACING → true (enables automatic tracing)
#
# Hybrid architecture:
# Embeddings → Ollama local (nomic-embed-text) — free, offline
# Generation → Ollama Cloud (llama3.3:70b)     — no local hardware needed
#
# Embedding prerequisite:
# ollama pull nomic-embed-text
# =============================================================================

[project]
name = "llm-eval-suite"
version = "0.1.0"
description = "LLM evaluation pipeline with RAG, public benchmarks, and BLEU/ROUGE/LLM-as-judge metrics"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Otniel Andrade", email = "" }
]
keywords = ["llm", "rag", "evaluation", "ollama", "langchain", "langsmith", "ragas", "benchmark", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # ── LLMs and APIs ────────────────────────────────────────────────────────
    "openai>=1.0.0",                      # Ollama Cloud (OpenAI-compatible)

    # ── LangChain 0.3.x stack ────────────────────────────────────────────────
    "langchain>=0.3.0,<0.4",
    "langchain-core>=0.3.51,<1.0.0",
    "langchain-openai>=0.3.0,<0.4",       # ChatOpenAI → Ollama Cloud
    "langchain-ollama>=0.3.0,<0.4",       # OllamaEmbeddings → local
    "langchain-community>=0.3.0,<0.4",
    "langchain-chroma>=0.2.0,<0.3",
    "langchain-text-splitters>=0.3.0,<0.4",
    # google-genai removed
    # langchain-google-genai removed

    # ── LangSmith ────────────────────────────────────────────────────────────
    "langsmith>=0.1.17,<0.4",

    # ── RAG and vector store ─────────────────────────────────────────────────
    "chromadb>=0.6.0",
    "ragas>=0.2.0,<0.3",

    # ── Text metrics ─────────────────────────────────────────────────────────
    "nltk>=3.9.0",
    "rouge-score>=0.1.2",

    # ── Datasets and utilities ───────────────────────────────────────────────
    "datasets>=3.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "httpx>=0.27.0",
]

[project.scripts]
build-datasets = "scripts.build_datasets:main"
run-benchmark  = "scripts.run_benchmark:main"
ingest-docs    = "scripts.ingest:main"
evaluate-rag   = "scripts.evaluate_rag:main"

[project.urls]
Repository = "https://github.com/otniel-andrade/llm-eval-suite"
Issues     = "https://github.com/otniel-andrade/llm-eval-suite/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval", "scripts"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.11.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "ipykernel>=6.29.0",
    "notebook>=7.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["llm_eval", "scripts"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/llm_eval", "scripts"]
omit = [
    "tests/*",
    "notebooks/*",
    "*/migrations/*",
    "scripts/run_benchmark.py",      
    "scripts/build_datasets.py",     
    "scripts/populate_raw_docs.py",  
    "scripts/ingest.py",             
    "src/llm_eval/shared/langsmith_tracer.py",  
    "src/llm_eval/clients/ollama_cliente.py",   
    "src/llm_eval/benchmark/prompt_strategies/*",  
]
fail_under = 80          